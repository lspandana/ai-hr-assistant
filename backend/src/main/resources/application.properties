# App Config
spring.application.name=ai-hr-assistant
server.port=8080

# Gemini AI Config (via OpenAI-compatible endpoint)
spring.ai.openai.base-url=https://generativelanguage.googleapis.com/v1beta/openai
spring.ai.openai.api-key=${GEMINI_API_KEY}
spring.ai.openai.chat.options.model=gemini-2.0-flash

# ChromaDB Vector Store Config
spring.ai.vectorstore.chroma.client.host=localhost
spring.ai.vectorstore.chroma.client.port=8000
spring.ai.vectorstore.chroma.collection-name=hr-documents

# Disable embedding model auto-config (we use Gemini)
spring.ai.openai.embedding.enabled=false

# CORS (allow React frontend)
spring.web.cors.allowed-origins=http://localhost:3000
